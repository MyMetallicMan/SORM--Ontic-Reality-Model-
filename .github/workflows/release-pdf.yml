name: Generate PDF on Release

on:
  release:
    types: [published]

permissions:
  contents: write      # Grants permission to upload assets

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-latex-extra

      - name: Combine Markdown files and generate PDF
        run: |
          mkdir -p output
          pandoc sections/*.md \
            --pdf-engine=xelatex \
            -V geometry:margin=1in \
            -V fontsize=12pt \
            -V mainfont="DejaVu Serif" \
            -V monofont="DejaVu Sans Mono" \
            --toc \
            --toc-depth=2 \
            -o output/SORM-v${{ github.event.release.tag_name }}.pdf

      - name: Upload PDF to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} output/SORM-v${{ github.event.release.tag_name }}.pdf --repo ${{ github.repository }}
